name: Уведомления во время переноса

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/booking-notifications.yml
      - api-config.json
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'

permissions:
  id-token: write

concurrency:
  group: booking-notifications
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Обновить Excel и обработать ожидающие сообщения ВК
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const configResponse = await fetch('https://raw.githubusercontent.com/shushakovd83-jpg/bana/' + process.env.GITHUB_SHA + '/api-config.json');
          if (!configResponse.ok) throw new Error('Configuration unavailable');
          const config = await configResponse.json();
          if (config.apiOrigin || !config.bookingOriginDuringMigration) process.exit(0);
          const endpoint = new URL('/api/jobs/notifications', config.bookingOriginDuringMigration).href;
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', endpoint);
          const identity = await fetch(tokenUrl, {
            headers: {Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}
          });
          if (!identity.ok) throw new Error('GitHub identity unavailable (' + identity.status + ')');
          const {value} = await identity.json();
          const result = await fetch(endpoint, {
            method: 'POST', redirect: 'error', headers: {Authorization: 'Bearer ' + value},
            signal: AbortSignal.timeout(100000)
          });
          if (!result.ok) throw new Error('Site returned ' + result.status);
          const {excelReady, connected, failed} = await result.json();
          if (!excelReady) throw new Error('Excel file was not verified');
          if (failed) throw new Error('VK has messages waiting for another delivery attempt');
          console.log(connected ? 'Excel ready. VK queue processed.' : 'Excel ready. Waiting for the VK community connection.');
          JS
